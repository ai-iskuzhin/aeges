name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack CLI tool
        run: >
          dotnet pack src/Aeges.Cli/Aeges.Cli.csproj
          -c Release
          -p:PackageVersion=${GITHUB_REF_NAME#v}
          -o artifacts/release

      - name: Stage installer
        run: |
          cp scripts/install.sh artifacts/release/install.sh
          cp scripts/install.ps1 artifacts/release/install.ps1

      - name: Write checksums
        working-directory: artifacts/release
        run: sha256sum * > SHA256SUMS

      - name: Publish NuGet package
        if: env.NUGET_TOKEN != ''
        run: >
          dotnet nuget push artifacts/release/*.nupkg
          --api-key "${NUGET_TOKEN}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Skip NuGet package publish
        if: env.NUGET_TOKEN == ''
        run: echo "NUGET_TOKEN is not configured; skipping NuGet publish."

      - name: Extract changelog notes
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          notes_path="artifacts/release-notes.md"

          awk -v version="$version" '
            $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
              in_section = 1
              next
            }

            in_section && /^## \[/ {
              exit
            }

            in_section {
              print
            }
          ' CHANGELOG.md > "$notes_path"

          if [ ! -s "$notes_path" ]; then
            {
              echo "Aeges ${version}"
              echo
              echo "No changelog entry was found for ${version}."
            } > "$notes_path"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          args=(
            artifacts/release/*
            --title "Aeges ${TAG_NAME#v}"
            --notes-file artifacts/release-notes.md
            --verify-tag
          )

          if [[ "$TAG_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${args[@]}"
